# fly.toml file generated for npm-registry-prod on 2022-10-29T09:48:58+01:00

app = "npm-registry-prod"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[env]
VERDACCIO_PORT = 4873

[experimental]
allowed_public_ports = []
auto_rollback = true

[[services]]
http_checks = []
internal_port = 4873
processes = ["app"]
protocol = "tcp"
script_checks = []
auto_stop_machines = "suspend" # or "stop", which is 2-3s slower, but less constrained https://docs.fly.io/reference/suspend-resume#requirements (e.g. doesn't have max 2 GB memory recommendation)
auto_start_machines = true
min_machines_running = 0       # allow scaling to zero

[services.concurrency]
hard_limit = 25
soft_limit = 20
type = "connections"

[[services.ports]]
force_https = true
handlers = ["http"]
port = 80

[[services.ports]]
handlers = ["tls", "http"]
port = 443

[[services.tcp_checks]]
grace_period = "1s"
interval = "15s"
restart_limit = 0
timeout = "2s"
